<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="t d">
  <title id="t">HelpDK screens</title>
  <desc id="d">Three phone screens: the Home screen with service categories, the nearby provider results with call, email and website buttons, and a provider detail screen. Sample data.</desc>
  <defs>
    <filter id="sh" x="-20%" y="-10%" width="140%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b3d2e" flood-opacity="0.22"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf6f0"/><stop offset="1" stop-color="#fafaf7"/></linearGradient>
    <clipPath id="clip"><rect width="300" height="600" rx="34"/></clipPath>
  </defs>
  <style>
    text { font-family: system-ui, "Segoe UI", Helvetica, Arial, sans-serif; fill: #171c19; }
    .m { fill: #747d76; }
    .g { fill: #087f5b; }
    .w { fill: #ffffff; }
    .card { fill: #fff; stroke: #e6eae5; stroke-width: 1.5; }
    .cap { font-size: 22px; font-weight: 700; }
    .sub { font-size: 14px; fill: #4b554e; }
  </style>
  <rect width="1200" height="790" fill="url(#bg)"/>

  <!-- ========== Phone 1: Home ========== -->
  <g transform="translate(60,40)">
    <g filter="url(#sh)"><rect width="300" height="600" rx="34" fill="#fafaf7" stroke="#171c19" stroke-width="7"/></g>
    <g clip-path="url(#clip)">
      <text x="24" y="42" font-size="10" font-weight="700" letter-spacing="2.5" class="g">LOKAL HJÆLP I NÆRHEDEN</text>
      <text x="24" y="76" font-size="22" font-weight="800">Hjælp til det, du</text>
      <text x="24" y="102" font-size="22" font-weight="800">ikke når selv.</text>
      <text x="24" y="124" font-size="10.5" class="m">Find dygtige mennesker til hverdagens opgaver.</text>

      <rect x="20" y="140" width="260" height="46" rx="14" class="card"/>
      <circle cx="42" cy="163" r="7" fill="none" stroke="#087f5b" stroke-width="2.2"/><path d="M47 168 l5 5" stroke="#087f5b" stroke-width="2.2" stroke-linecap="round"/>
      <text x="62" y="167" font-size="11.5" class="m">Hvad skal du have hjælp til?</text>
      <rect x="240" y="148" width="32" height="30" rx="10" class="g"/><path d="M250 163 h12 m-5 -5 l5 5 -5 5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="24" y="224" font-size="14" font-weight="700">Hvad har du brug for?</text>
      <text x="250" y="224" font-size="11" font-weight="700" class="g" text-anchor="middle">Se alle</text>

      <g font-size="10" text-anchor="middle">
        <g transform="translate(20,240)"><rect width="82" height="82" rx="16" class="card"/><circle cx="41" cy="31" r="15" fill="#e7f6f0"/><path d="M33 36 l16 -14 m-4 -3 l7 7" stroke="#087f5b" stroke-width="2.4" stroke-linecap="round" fill="none"/><text x="41" y="68">Carpentry</text></g>
        <g transform="translate(109,240)"><rect width="82" height="82" rx="16" class="card"/><circle cx="41" cy="31" r="15" fill="#e7f6f0"/><path d="M33 38 l10 -18 l8 4 l-6 16z" stroke="#087f5b" stroke-width="2.2" fill="none" stroke-linejoin="round"/><text x="41" y="68">Cleaning</text></g>
        <g transform="translate(198,240)"><rect width="82" height="82" rx="16" class="card"/><circle cx="41" cy="31" r="15" fill="#e7f6f0"/><rect x="32" y="22" width="18" height="18" rx="2" stroke="#087f5b" stroke-width="2.2" fill="none"/><path d="M41 22 v18 M32 31 h18" stroke="#087f5b" stroke-width="1.6"/><text x="41" y="68">Windows</text></g>
        <g transform="translate(20,329)"><rect width="82" height="82" rx="16" class="card"/><circle cx="41" cy="31" r="15" fill="#e7f6f0"/><path d="M41 21 c-6 8 -8 11 -8 15 a8 8 0 0 0 16 0 c0 -4 -2 -7 -8 -15z" stroke="#087f5b" stroke-width="2.2" fill="none" stroke-linejoin="round"/><text x="41" y="68">Plumbing</text></g>
        <g transform="translate(109,329)"><rect width="82" height="82" rx="16" class="card"/><circle cx="41" cy="31" r="15" fill="#e7f6f0"/><path d="M44 21 l-9 13 h7 l-3 10 11 -14 h-7z" stroke="#087f5b" stroke-width="2" fill="none" stroke-linejoin="round"/><text x="41" y="68">Electrical</text></g>
        <g transform="translate(198,329)"><rect width="82" height="82" rx="16" class="card"/><circle cx="41" cy="31" r="15" fill="#e7f6f0"/><rect x="33" y="23" width="16" height="9" rx="2" stroke="#087f5b" stroke-width="2.2" fill="none"/><path d="M41 32 v8" stroke="#087f5b" stroke-width="2.2"/><text x="41" y="68">Painting</text></g>
        <g transform="translate(20,418)"><rect width="82" height="82" rx="16" class="card"/><circle cx="41" cy="31" r="15" fill="#e7f6f0"/><path d="M41 40 v-14 m0 6 c-6 0 -8 -4 -8 -8 c6 0 8 3 8 8 m0 0 c6 0 8 -4 8 -8 c-6 0 -8 3 -8 8" stroke="#087f5b" stroke-width="2" fill="none" stroke-linecap="round"/><text x="41" y="68">Gardening</text></g>
        <g transform="translate(109,418)"><rect width="82" height="82" rx="16" class="card"/><circle cx="41" cy="31" r="15" fill="#e7f6f0"/><rect x="31" y="26" width="14" height="10" rx="1.5" stroke="#087f5b" stroke-width="2.2" fill="none"/><path d="M45 29 h5 l3 4 v3 h-8" stroke="#087f5b" stroke-width="2.2" fill="none" stroke-linejoin="round"/><text x="41" y="68">Moving</text></g>
        <g transform="translate(198,418)"><rect width="82" height="82" rx="16" class="card"/><circle cx="41" cy="31" r="15" fill="#e7f6f0"/><path d="M34 40 l11 -11 a6 6 0 1 0 -4 -4 l-11 11z" stroke="#087f5b" stroke-width="2.2" fill="none" stroke-linejoin="round"/><text x="41" y="68">Repairs</text></g>
      </g>

      <rect y="548" width="300" height="52" fill="#fff"/><path d="M0 548 H300" stroke="#e6eae5" stroke-width="1.5"/>
      <g font-size="9.5" text-anchor="middle"><text x="60" y="582" class="g" font-weight="700">Home</text><text x="150" y="582" class="m">Search</text><text x="240" y="582" class="m">Saved</text></g>
      <circle cx="60" cy="563" r="5" class="g"/><circle cx="150" cy="563" r="5" fill="#c9d1cb"/><circle cx="240" cy="563" r="5" fill="#c9d1cb"/>
    </g>
    <text x="150" y="676" text-anchor="middle" class="cap">1 · Find</text>
    <text x="150" y="702" text-anchor="middle" class="sub">Pick a service, or search</text>
  </g>

  <!-- ========== Phone 2: Results ========== -->
  <g transform="translate(450,40)">
    <g filter="url(#sh)"><rect width="300" height="600" rx="34" fill="#fafaf7" stroke="#171c19" stroke-width="7"/></g>
    <g clip-path="url(#clip)">
      <rect x="20" y="22" width="260" height="38" rx="12" class="card"/>
      <path d="M40 33 c-5 0 -8 4 -8 8 c0 6 8 12 8 12 s8 -6 8 -12 c0 -4 -3 -8 -8 -8z" class="g"/><circle cx="40" cy="41" r="3" fill="#fff"/>
      <text x="58" y="45" font-size="11.5" font-weight="700">Esbjerg</text><text x="108" y="45" font-size="11" class="m">within 25 km</text>
      <text x="262" y="45" font-size="10.5" font-weight="700" class="g" text-anchor="end">Change</text>

      <g font-size="10.5" font-weight="600">
        <rect x="20" y="72" width="44" height="24" rx="12" fill="#e6eae5"/><text x="42" y="88" text-anchor="middle">All</text>
        <rect x="70" y="72" width="78" height="24" rx="12" class="g"/><text x="109" y="88" text-anchor="middle" class="w">Carpentry</text>
        <rect x="154" y="72" width="70" height="24" rx="12" fill="#e6eae5"/><text x="189" y="88" text-anchor="middle">Cleaning</text>
      </g>
      <text x="24" y="122" font-size="10.5" class="m">3 of 100 providers · nearest first</text>

      <!-- card 1 -->
      <g transform="translate(20,134)">
        <rect width="260" height="112" rx="16" class="card"/>
        <text x="14" y="24" font-size="13" font-weight="800">Nordstrand Tømrer</text>
        <text x="14" y="39" font-size="9.5" class="m">No ratings yet</text>
        <path d="M240 22 c-3 -4 -9 -1 -7 4 c1.5 3 7 7 7 7 s5.500 -4 7 -7 c2 -5 -4 -8 -7 -4z" fill="none" stroke="#747d76" stroke-width="1.6"/>
        <rect x="14" y="48" width="62" height="17" rx="8.500" fill="#e7f6f0"/><text x="45" y="60" font-size="9" font-weight="700" class="g" text-anchor="middle">Carpentry</text>
        <g font-size="10" font-weight="700">
          <rect x="14" y="72" width="56" height="26" rx="13" class="g"/><text x="42" y="89" class="w" text-anchor="middle">Call</text>
          <rect x="76" y="72" width="58" height="26" rx="13" fill="#e6eae5"/><text x="105" y="89" text-anchor="middle">Email</text>
          <rect x="140" y="72" width="74" height="26" rx="13" fill="#fff" stroke="#c9d1cb" stroke-width="1.5"/><text x="177" y="89" text-anchor="middle">Website</text>
        </g>
        <text x="246" y="55" font-size="9.5" class="m" text-anchor="end">1.2 km</text>
      </g>
      <!-- card 2 -->
      <g transform="translate(20,254)">
        <rect width="260" height="112" rx="16" class="card"/>
        <text x="14" y="24" font-size="13" font-weight="800">Havnens Snedkeri</text>
        <text x="14" y="39" font-size="9.5" class="m">No ratings yet</text>
        <path d="M240 22 c-3 -4 -9 -1 -7 4 c1.5 3 7 7 7 7 s5.500 -4 7 -7 c2 -5 -4 -8 -7 -4z" fill="none" stroke="#747d76" stroke-width="1.6"/>
        <rect x="14" y="48" width="62" height="17" rx="8.500" fill="#e7f6f0"/><text x="45" y="60" font-size="9" font-weight="700" class="g" text-anchor="middle">Carpentry</text>
        <g font-size="10" font-weight="700">
          <rect x="14" y="72" width="56" height="26" rx="13" class="g"/><text x="42" y="89" class="w" text-anchor="middle">Call</text>
          <rect x="76" y="72" width="74" height="26" rx="13" fill="#fff" stroke="#c9d1cb" stroke-width="1.5"/><text x="113" y="89" text-anchor="middle">Website</text>
        </g>
        <text x="246" y="55" font-size="9.5" class="m" text-anchor="end">2.8 km</text>
      </g>
      <!-- card 3 -->
      <g transform="translate(20,374)">
        <rect width="260" height="112" rx="16" class="card"/>
        <text x="14" y="24" font-size="13" font-weight="800">Kjær Træ og Montage</text>
        <text x="14" y="39" font-size="9.5" class="m">No ratings yet</text>
        <path d="M240 22 c-3 -4 -9 -1 -7 4 c1.5 3 7 7 7 7 s5.500 -4 7 -7 c2 -5 -4 -8 -7 -4z" fill="none" stroke="#747d76" stroke-width="1.6"/>
        <rect x="14" y="48" width="62" height="17" rx="8.500" fill="#e7f6f0"/><text x="45" y="60" font-size="9" font-weight="700" class="g" text-anchor="middle">Carpentry</text>
        <g font-size="10" font-weight="700">
          <rect x="14" y="72" width="56" height="26" rx="13" class="g"/><text x="42" y="89" class="w" text-anchor="middle">Call</text>
          <rect x="76" y="72" width="58" height="26" rx="13" fill="#e6eae5"/><text x="105" y="89" text-anchor="middle">Email</text>
        </g>
        <text x="246" y="55" font-size="9.5" class="m" text-anchor="end">4.1 km</text>
      </g>

      <g transform="translate(150,520)">
        <circle cx="-86" cy="0" r="6" fill="none" stroke="#087f5b" stroke-width="2" stroke-dasharray="20 10"><animateTransform attributeName="transform" type="rotate" from="0 -86 0" to="360 -86 0" dur="1s" repeatCount="indefinite"/></circle>
        <text x="-72" y="4" font-size="10.5" class="m">Still searching for more nearby...</text>
      </g>
      <rect y="548" width="300" height="52" fill="#fff"/><path d="M0 548 H300" stroke="#e6eae5" stroke-width="1.5"/>
      <g font-size="9.5" text-anchor="middle"><text x="60" y="582" class="m">Home</text><text x="150" y="582" class="g" font-weight="700">Search</text><text x="240" y="582" class="m">Saved</text></g>
      <circle cx="60" cy="563" r="5" fill="#c9d1cb"/><circle cx="150" cy="563" r="5" class="g"/><circle cx="240" cy="563" r="5" fill="#c9d1cb"/>
    </g>
    <text x="150" y="676" text-anchor="middle" class="cap">2 · Compare</text>
    <text x="150" y="702" text-anchor="middle" class="sub">Nearest first, results stream in</text>
  </g>

  <!-- ========== Phone 3: Detail ========== -->
  <g transform="translate(840,40)">
    <g filter="url(#sh)"><rect width="300" height="600" rx="34" fill="#fafaf7" stroke="#171c19" stroke-width="7"/></g>
    <g clip-path="url(#clip)">
      <path d="M32 40 l-8 8 8 8 M24 48 h18" stroke="#171c19" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="96" font-size="22" font-weight="800">Nordstrand Tømrer</text>
      <rect x="24" y="110" width="66" height="19" rx="9.500" fill="#e7f6f0"/><text x="57" y="123.500" font-size="9.500" font-weight="700" class="g" text-anchor="middle">Carpentry</text>
      <text x="24" y="152" font-size="10.500" class="m">No ratings yet</text>

      <rect x="20" y="168" width="260" height="76" rx="16" class="card"/>
      <path d="M42 188 c-6 0 -9 4 -9 9 c0 7 9 14 9 14 s9 -7 9 -14 c0 -5 -3 -9 -9 -9z" class="g"/><circle cx="42" cy="197" r="3.200" fill="#fff"/>
      <text x="64" y="196" font-size="11.500" font-weight="700">Strandvejen 12</text>
      <text x="64" y="212" font-size="10.500" class="m">6700 Esbjerg</text>
      <text x="64" y="230" font-size="10" class="g" font-weight="700">1.2 km from you</text>

      <g font-size="12.500" font-weight="700" text-anchor="middle">
        <rect x="20" y="262" width="260" height="46" rx="14" class="g"/><text x="150" y="290" class="w">Call</text>
        <rect x="20" y="318" width="260" height="46" rx="14" fill="#e6eae5"/><text x="150" y="346">Email</text>
        <rect x="20" y="374" width="260" height="46" rx="14" fill="#fff" stroke="#c9d1cb" stroke-width="1.5"/><text x="150" y="402">Visit website</text>
        <rect x="20" y="430" width="260" height="46" rx="14" fill="#fff" stroke="#c9d1cb" stroke-width="1.5"/><text x="150" y="458">Save for later</text>
      </g>
      <text x="150" y="506" font-size="9" class="m" text-anchor="middle">Contact details come from OpenStreetMap</text>
      <text x="150" y="520" font-size="9" class="m" text-anchor="middle">and the provider's own public website.</text>
    </g>
    <text x="150" y="676" text-anchor="middle" class="cap">3 · Contact</text>
    <text x="150" y="702" text-anchor="middle" class="sub">Call, email, or visit the site</text>
  </g>

  <text x="600" y="776" text-anchor="middle" font-size="12" class="m">Illustration with fictional sample data. The real app shows live providers around you.</text>
</svg>
