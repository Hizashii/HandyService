<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Håndmatch</title>
  <desc id="d">Håndmatch banner: local help nearby, with animated map pins over a green gradient.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#065f46"/>
      <stop offset="0.55" stop-color="#087f5b"/>
      <stop offset="1" stop-color="#0fa874"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.12"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <path id="pin" d="M0 -26 c-14 0 -22 10 -22 22 c0 16 22 38 22 38 s22 -22 22 -38 c0 -12 -8 -22 -22 -22z"/>
  </defs>
  <style>
    text { font-family: system-ui, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-reduced-motion: reduce) { animate { display: none; } }
  </style>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#dots)"/>
  <circle cx="1010" cy="200" r="260" fill="#ffffff" opacity="0.06"/>
  <circle cx="1010" cy="200" r="170" fill="#ffffff" opacity="0.07"/>
  <circle cx="1010" cy="200" r="90" fill="#ffffff" opacity="0.09"/>

  <text x="70" y="120" font-size="15" font-weight="700" letter-spacing="5" fill="#d1fae5">LOKAL HJÆLP I NÆRHEDEN</text>
  <text x="68" y="215" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-3">Håndmatch</text>
  <text x="70" y="262" font-size="27" fill="#ecfdf5">Find the best local help for everyday jobs.</text>
  <text x="70" y="300" font-size="19" fill="#a7f3d0">Carpentry · Cleaning · Plumbing · Electrical · Painting · Gardening · Moving</text>

  <rect x="70" y="326" width="160" height="38" rx="19" fill="#ffffff"/>
  <text x="150" y="350" text-anchor="middle" font-size="15" font-weight="600" fill="#065f46">Real local data</text>
  <rect x="244" y="326" width="186" height="38" rx="19" fill="#ffffff" opacity="0.18"/>
  <text x="337" y="350" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Call or email in 1 tap</text>

  <g filter="url(#sh)">
    <g transform="translate(900,150)">
      <circle r="10" fill="#fff" opacity="0.5"><animate attributeName="r" values="10;38;10" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite"/></circle>
      <use href="#pin" fill="#fff"/><circle cy="-4" r="8" fill="#087f5b"/>
    </g>
    <g transform="translate(1060,120)">
      <circle r="10" fill="#fff" opacity="0.5"><animate attributeName="r" values="10;38;10" dur="3s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0;0.5" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
      <use href="#pin" fill="#fff"/><circle cy="-4" r="8" fill="#087f5b"/>
    </g>
    <g transform="translate(980,260)">
      <circle r="10" fill="#fff" opacity="0.5"><animate attributeName="r" values="10;38;10" dur="3s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0;0.5" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle>
      <use href="#pin" fill="#fff"/><circle cy="-4" r="8" fill="#087f5b"/>
    </g>
    <g transform="translate(1110,270)">
      <circle r="10" fill="#fff" opacity="0.5"><animate attributeName="r" values="10;38;10" dur="3s" begin="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0;0.5" dur="3s" begin="2.2s" repeatCount="indefinite"/></circle>
      <use href="#pin" fill="#fff"/><circle cy="-4" r="8" fill="#087f5b"/>
    </g>
  </g>
  <text x="1010" y="352" text-anchor="middle" font-size="15" fill="#d1fae5" letter-spacing="1">Only providers within 25 km of you</text>
</svg>
